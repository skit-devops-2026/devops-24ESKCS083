name: CI

on:
  push:
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Given to you. Do not delete this job.
  # ---------------------------------------------------------------------------
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run hygiene checks
        run: bash scripts/hygiene.sh

  # ---------------------------------------------------------------------------
  # M3 — Build and test job
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository source code
      - name: Check out repository code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js 24 runtime environment with npm cache for faster repeated runs
      - name: Set up Node.js 24 and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      # Step 3: Install application dependencies via Makefile target
      - name: Install dependencies
        run: make install

      # Step 4: Run the test / linting suite via Makefile target (fails pipeline if tests fail)
      - name: Run lint and test suite
        run: make test

      # Step 5: Build the production bundle via Makefile target
      - name: Build production bundle
        run: make build

  # ---------------------------------------------------------------------------
  # M4 — Containerization and image publishing
  # ---------------------------------------------------------------------------
  docker:
    name: Build and push images
    needs: build-and-test
    runs-on: ubuntu-latest
    # Run only on pushes to main branch; do not run on pull requests or feature branches
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      # Step 1: Check out the repository code to access Dockerfile and source files
      - name: Check out repository code
        uses: actions/checkout@v4

      # Step 2: Extract Docker metadata (tags and labels) and lowercase repository name.
      # OCI registry specification requires lowercase image names, but github.repository
      # contains uppercase characters (devops-24ESKCS083). docker/metadata-action handles
      # lowercasing automatically and tags with both the commit SHA and latest.
      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      # Step 3: Authenticate with GitHub Container Registry using the automated GITHUB_TOKEN
      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Build multi-stage Docker image from repo root context and push to GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ---------------------------------------------------------------------------
  # M6 — Deploy to Render
  # Triggers a re-deploy of the Render web service by calling the Render Deploy Hook.
  # Prerequisites:
  #   1. Create a web service on https://render.com pointed at this repo.
  #   2. Set the Docker image to: ghcr.io/skit-devops-2026/devops-24eskcs083:latest
  #   3. Copy the "Deploy Hook" URL from the service's Settings tab.
  #   4. Add it as a repository secret named RENDER_DEPLOY_HOOK_URL.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Render
    needs: docker
    runs-on: ubuntu-latest
    # Only deploy from the main branch, not from PRs or feature branches
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # Step 1: Trigger Render to pull the freshly-pushed Docker image and redeploy
      - name: Trigger Render deploy hook
        run: |
          curl -fsSL --retry 3 \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -o /dev/null \
            -w "HTTP %{http_code}\n"
