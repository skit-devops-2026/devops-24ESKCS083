server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets or fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nginx stub_status endpoint — exposes connection metrics for nginx-prometheus-exporter
    # Restricted to localhost/internal Docker network only; never exposed publicly
    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;   # Docker bridge networks
        deny all;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
